# memtest1: stage 1 on the single-cup memory dataset (45-step episodes, action_dim 1).
#   pixi run train-wm --config-name train_memtest1 [overrides]
defaults:
  - train
  - override data: memtest1
  - _self_

logdir: logdir/world_model/${model.name}_memtest1/${now:%Y-%m-%d_%H-%M-%S}_memtest1

trainer:
  steps: 12000              # 1000 epochs: 200 episodes / batch 16 = 12 updates per epoch
  eval_every: 1e9           # no holdout split, so no holdout eval and no wm_best.pt

wandb:
  group: ${model.name}_memtest1
  tags: [memtest1]
