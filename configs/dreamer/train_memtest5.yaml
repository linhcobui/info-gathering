# memtest5: stage 1 on the two-cup version of memtest4 (0-4 swaps, 60-step padded episodes).
#   pixi run train-wm --config-name train_memtest5 [overrides]
defaults:
  - train
  - override data: memtest5
  - _self_

logdir: logdir/world_model/${model.name}_memtest5/${now:%Y-%m-%d_%H-%M-%S}_memtest5

trainer:
  steps: 15000              # 1000 epochs: 250 episodes / batch 16 = 15 updates per epoch
  eval_every: 1e9           # no holdout split, so no holdout eval and no wm_best.pt

wandb:
  group: ${model.name}_memtest5
  tags: [memtest5]
