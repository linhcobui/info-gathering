# memtest2: stage 1 on the two-cup swap dataset (45-step padded episodes, action_dim 2).
#   pixi run train-wm --config-name train_memtest2 [overrides]
defaults:
  - train
  - override data: memtest2
  - _self_

logdir: logdir/world_model/${model.name}_memtest2/${now:%Y-%m-%d_%H-%M-%S}_memtest2

trainer:
  steps: 12000              # 1000 epochs: 200 episodes / batch 16 = 12 updates per epoch
  eval_every: 1e9           # no holdout split, so no holdout eval and no wm_best.pt

wandb:
  group: ${model.name}_memtest2
  tags: [memtest2]
