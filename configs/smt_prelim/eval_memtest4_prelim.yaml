# PRELIMINARY. memtest4 eval for the smt_prelim backend: watch through the hold (0-4
# random-pair swaps), then imagine the lift. F1 comes from the yellow-pixel detector on
# decoded frames only.
#
# Self-contained (no defaults list): loaded from a second config dir alongside
# configs/dreamer, where an inherited default would be ambiguous.
#
# The positive rate is 1/3, not 1/2: "always empty" scores 0.667 accuracy and F1 0, and
# guessing at the base rate scores about F1 0.33. Only the lift segment is meaningful --
# the first action onset is the cover, where there is no ball question.
#   pixi run eval-smt-prelim decoder_run=<pixel_decoder_prelim run>
hydra:
  run:
    dir: ${outdir}
  job:
    chdir: false

decoder_run: ???
decoder_checkpoint: ${decoder_run}/checkpoints/decoder_latest.pt
zarr_path: data/memtest4_eval.zarr
outdir: ${decoder_run}/eval_memtest4_prelim/${now:%Y-%m-%d_%H-%M-%S}
device: cuda:0
seed: 0

horizon: 9                          # imagined steps after an action onset (the lift is 10 incl. the onset)
label_key: ball_under_target
meta_keys: [ball_under_target, ball_slot, phase]

detector:
  threshold: 0.15
  min_pixels: 3

sheet_max_rows: 60

videos:
  holds: [10, 22, 34]
  fps: 4

hold_offset: 20                     # memtest4 has no closed phase: reveal 10 + show 10 outside the hold
