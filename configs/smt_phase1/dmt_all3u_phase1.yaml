# PHASE 1 stage 1b: DMT on ALL3-U (data/memtest4_all3u.zarr, 768 training episodes), for the ALL3-U arms.
# coef_slot 0: the read-out loss supervises the hidden ball bit (ball_full) at EVERY rolled step, which is
# privileged; for label-free arms (Align-Walk) DMT keeps only the label-free terms (dyn + prior).
#   pixi run python scripts/train_dmt_phase1.py --config-name dmt_all3u_phase1 wm_run=<smt_phase1 run dir>
defaults:
  - data@data_rollouts: memtest4_all3u_rollouts
  - _self_

hydra:
  run:
    dir: ${logdir}
  job:
    chdir: false

wm_run: ???
wm_checkpoint: ${wm_run}/checkpoints/wm_latest.pt
logdir: ${wm_run}/dmt/${now:%Y-%m-%d_%H-%M-%S}
seed: 0
device: cuda:0

loader:
  batch_size: 24
  num_workers: 4

dmt:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  clip_grad_norm: 1.0
  amp_dtype: bfloat16
  coef_dyn: 1.0
  coef_prior: 1.0
  coef_slot: 0.0               # privileged (dense hidden ball bit) -> off for label-free arms
  detach_rnn: true
  detach_readout: true
  cache_teacher: true

trainer:
  steps: 6000
  log_every: 250
  eval_every: 1000
  ckpt_every: 2000
  resume: null

wandb:
  project: info-gathering-wm
  entity: null
  group: smt_phase1_all3u
  mode: online
  tags: [phase1, dmt, all3u]

tensorboard: true
