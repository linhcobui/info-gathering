# PHASE 1, ALIGNMENT + LIFT-ONLY BINARY SIGNAL. As the alignment arm, but the decoder head is
# back to the original weak signal: one bit per episode, "is the ball under the lifted cup",
# supervised only on the 9 lift frames. Alignment (which does use the slot label to define
# positive pairs) is then the main pressure shaping the state.
#   pixi run train-smt-phase1-alignlift
defaults:
  - data: memtest4_big_windows
  - data@data_anchors: memtest4_big_anchors
  - model: smt_phase1
  - _self_

hydra:
  run:
    dir: ${logdir}
  job:
    chdir: false

logdir: logdir/world_model/smt_phase1_memtest4_big/${now:%Y-%m-%d_%H-%M-%S}_memtest4_big_alignlift_phase1
seed: 0
device: cuda:0

loader:
  batch_size: 128
  num_workers: 4

trainer:
  steps: 20000
  log_every: 250
  eval_every: 1000
  best_metric: opt/loss
  ckpt_every: 2500
  resume: null

wandb:
  project: info-gathering-wm
  entity: null
  group: smt_phase1_memtest4_big
  mode: online
  tags: [phase1, smt, memtest4]

tensorboard: true

model:
  embed_stats_zarr: data/memtest4_big.zarr   # mean/std from THIS training set
  arch:
    decoder_obs: false
    reward_head: binary
  loss:
    coef_unif: 0.0            # blind uniformity OFF
    coef_align: 0.1           # the main compression pressure in this arm
    coef_sep: 1.0e-3
    align_margin: 20.0
