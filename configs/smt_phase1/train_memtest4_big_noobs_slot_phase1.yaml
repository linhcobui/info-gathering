# PHASE 1, SLOT-HEAD arm. Identical to train_memtest4_big_noobs_phase1.yaml (500 eps,
# decoder sees [memory ; future actions] only) except the decoder predicts WHICH slot (0/1/2)
# holds the ball rather than whether it is under the lifted cup. 3-way cross-entropy on the
# same 9 lift frames per episode. Binary metrics read p(slot 0), so arms stay comparable.
#   pixi run train-smt-phase1-big-noobs-slot
defaults:
  - data: memtest4_big_windows
  - data@data_anchors: memtest4_big_anchors
  - model: smt_phase1
  - _self_

hydra:
  run:
    dir: ${logdir}
  job:
    chdir: false

logdir: logdir/world_model/smt_phase1_memtest4_big/${now:%Y-%m-%d_%H-%M-%S}_memtest4_big_noobs_slot_phase1
seed: 0
device: cuda:0

loader:
  batch_size: 128
  num_workers: 4

trainer:
  steps: 20000
  log_every: 250
  eval_every: 1000
  best_metric: opt/loss
  ckpt_every: 2500
  resume: null

wandb:
  project: info-gathering-wm
  entity: null
  group: smt_phase1_memtest4_big
  mode: online
  tags: [phase1, smt, memtest4]

tensorboard: true

model:
  embed_stats_zarr: data/memtest4_big.zarr   # mean/std from THIS training set
  arch:
    decoder_obs: false
    reward_head: slot
