train-smt-phase1-oracle-noalign = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_oracle_noalign_phase1"
train-smt-phase1-oracle-align = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_oracle_align_phase1"
train-smt-phase1-aligndtw = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_aligndtw_phase1"
train-smt-phase1-aligndtw-attract = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_aligndtwattract_phase1"
train-smt-phase1-aligndtwpair = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_aligndtwpair_phase1"
