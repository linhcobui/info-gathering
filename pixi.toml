train-smt-phase1-delta-tok-hi = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_delta_tok_hi_phase1"
train-smt-phase1-delta-dim = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_delta_dim_phase1"
train-smt-phase1-delta-depth1 = "python scripts/train_smt_phase1.py --config-name train_memtest4_depth1_delta_phase1"
train-smt-phase1-depth1-noobs = "python scripts/train_smt_phase1.py --config-name train_memtest4_depth1_noobs_phase1"
# TWIN_FINETUNE.md: C0 (0-3 swaps), C1 (S1 + finetune pool, labelled), the finetune, the report
train-smt-phase1-s3-noobs = "python scripts/train_smt_phase1.py --config-name train_memtest4_s3_noobs_phase1"
