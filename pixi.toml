[project]
name = "info-gathering"
version = "0.1.0"
description = "Offline dataset generation for cups-and-ball world model"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
tmux = "*"
python = "3.11.*"
pip = "*"

# core numerics
numpy = "*"
scipy = "*"

# dataset I/O
h5py = "*"
zarr = "<3"

# video / image
imageio = "*"
imageio-ffmpeg = "*"
pillow = "*"

# utilities
# packaging capped <26: tensordict 0.9.1 -> pyvers requires packaging>=25,<26
packaging = ">=25.0,<26.0"
tqdm = "*"
matplotlib = "*"
pyyaml = "*"

# notebooks (optional but handy for inspecting frames)
jupyterlab = "*"
ipykernel = "*"

# EGL for headless GPU rendering
libglvnd = "*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[pypi-dependencies]
mujoco = ">=3.2"
mediapy = "*"

# r2dreamer training stack (submodules/r2dreamer)
# NOTE: deliberately NOT installing r2dreamer as a package — its pyproject
# hard-pins numpy==1.26.0 / mujoco==3.3.0, which would downgrade the data-gen env.
torch = "==2.8.0"
torchrl = "==0.9.2"
tensordict = "==0.9.1"
hydra-core = "==1.3.2"
gymnasium = "==1.2.0"
einops = "==0.8.1"          # bumped from 0.3.0 for x-transformers; nothing else uses einops
x-transformers = "==2.18.5" # the attention stack SMT is written against (submodules/smt/requirements.txt)
"ruamel.yaml" = "==0.17.4"
moviepy = "==1.0.3"
tensorboard = ">=2.20,<3"

# OGBar (src/ogbar, adapted from submodules/ogbench): dm_control for mjcf scene
# assembly. 1.0.46 is the newest release that accepts mujoco 3.13; 1.0.48 forces 3.15.
dm_control = "==1.0.46"

# experiment tracking
wandb = "*"
pandas = ">=3.1.0, <4"
pyarrow = ">=26.0.1, <27"
pytest = ">=9.2.0, <10"

# ---------------------------------------------------------------------------
# ReMemBench (submodules/ReMemBench, a RoboCasa fork) + its robosuite fork
# (submodules/robosuite, branch abs_robot). Separate environment: robocasa
# hard-pins numpy==1.23.3 / numba==0.56.4 / mujoco==3.2.6, and numba 0.56 has
# no Python 3.11 build, so it cannot share the default env (numpy 2, mujoco 3.13).
#   pixi run -e remembench remembench-download-assets   # ~5GB kitchen assets
#   pixi run -e remembench remembench-setup-macros
# ---------------------------------------------------------------------------
[feature.remembench.dependencies]
python = "3.10.*"
pip = "*"
libglvnd = "*"

[feature.remembench.pypi-dependencies]
robosuite = { path = "submodules/robosuite", editable = true }
robocasa = { path = "submodules/ReMemBench", editable = true }

[feature.remembench.tasks]
remembench-download-assets = { cmd = "python robocasa/scripts/download_kitchen_assets.py", cwd = "submodules/ReMemBench" }
remembench-setup-macros = { cmd = "python robocasa/scripts/setup_macros.py", cwd = "submodules/ReMemBench" }

[environments]
remembench = { features = ["remembench"], no-default-feature = true }

[tasks]
# convenience shortcuts — run with `pixi run <name>`
test-render = "python scripts/test_render.py"
generate = "python scripts/generate_data.py"
generate-memtest1 = "python scripts/generate_memtest1.py"
generate-memtest2 = "python scripts/generate_memtest2.py"
generate-memtest3 = "python scripts/generate_memtest2.py --config configs/data/memtest3.yaml"
generate-memtest4 = "python scripts/generate_memtest4.py"
generate-memtest5 = "python scripts/generate_memtest4.py --config configs/data/memtest5.yaml"
generate-ogbar = "python scripts/generate_ogbar.py"
ogbar-sweep = "python scripts/ogbar_physics_sweep.py"
ogbar-report = "python scripts/ogbar_report.py"
preprocess-frames = "python scripts/preprocess_frames.py"
train-wm = "python scripts/train_world_model.py"
train-decoder = "python scripts/train_decoder.py"
eval-lift = "python scripts/eval_lift_rollout.py"
eval-memtest1 = "python scripts/eval_memtest1.py"
probe-latent = "python scripts/probe_latent.py"
rollout-videos = "python scripts/rollout_videos.py"

# preliminary: SMT-supervised memory over frozen Dreamer embeddings
cache-embeddings-prelim = "python scripts/cache_embeddings_prelim.py"
train-smt-prelim = "python scripts/train_smt_prelim.py"
train-pixel-decoder-prelim = "python scripts/train_decoder.py --config-dir configs/smt_prelim --config-name pixel_decoder_prelim"
closure-smt-prelim = "python scripts/closure_smt_prelim.py"
eval-smt-prelim = "python scripts/eval_memtest1.py --config-dir configs/smt_prelim --config-name eval_memtest4_prelim"

# phase 1: vector memory, prior/posterior updaters, reward-only decoder
verify-smt-phase1 = "python scripts/verify_smt_phase1.py"
train-smt-phase1 = "python scripts/train_smt_phase1.py"
closure-smt-phase1 = "python scripts/closure_smt_phase1.py"
train-readout-phase1 = "python scripts/train_readout_phase1.py"
train-pixel-decoder-phase1 = "python scripts/train_decoder.py --config-dir configs/smt_phase1 --config-name pixel_decoder_phase1"
eval-smt-phase1 = "python scripts/eval_memtest1.py --config-dir configs/smt_phase1 --config-name eval_memtest4_phase1"
readout-ceiling-phase1 = "python scripts/readout_ceiling_phase1.py"
onset-probe-phase1 = "python scripts/onset_probe_phase1.py"
train-smt-phase1-big = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_phase1"
train-smt-phase1-big-noobs = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_noobs_phase1"
train-smt-phase1-big-noobs-slot = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_noobs_slot_phase1"
train-smt-phase1-big-noobs-slotdense = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_noobs_slotdense_phase1"
train-smt-phase1-big-noobs-slotdense-nounif = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_noobs_slotdense_nounif_phase1"
train-smt-phase1-depth1 = "python scripts/train_smt_phase1.py --config-name train_memtest4_depth1_phase1"
train-dmt-phase1 = "python scripts/train_dmt_phase1.py"
train-dmt-phase1-big = "python scripts/train_dmt_phase1.py --config-name dmt_big_phase1"
train-smt-phase1-aligndense = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_aligndense_phase1"
train-smt-phase1-alignlift = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_alignlift_phase1"
train-smt-phase1-aligntarget = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_aligntarget_phase1"
train-smt-phase1-alignpos = "python scripts/train_smt_phase1.py --config-name train_memtest4_big_alignpos_phase1"
